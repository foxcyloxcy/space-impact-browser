name: Deploy Nuxt to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --non-interactive
      - name: Unit tests
        run: yarn test
      - name: Generate Nuxt static site
        env:
          NUXT_APP_BASE_URL: /space-impact-browser/
        run: yarn generate
      - name: Prevent Jekyll processing
        run: touch .output/public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
